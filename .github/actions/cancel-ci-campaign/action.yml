name: Cancel failed CI campaign
description: Stop CI, Web and Documents for the same revision after preserving failure evidence.
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: |
          const cancel = require(`${process.env.GITHUB_WORKSPACE}/scripts/cancel-ci-campaign.cjs`);
          await cancel({ github, context, core });
