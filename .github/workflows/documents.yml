name: Documents

on:
  pull_request:
    paths:
      - '.github/workflows/documents.yml'
      - '.gitignore'
      - 'latex/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/documents.yml'
      - '.gitignore'
      - 'latex/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach the report to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: documents-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build report PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Install LaTeX and document fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          printf '%s\n' 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' |
            sudo debconf-set-selections
          sudo --preserve-env=DEBIAN_FRONTEND apt-get install -y --no-install-recommends \
            latexmk texlive-luatex texlive-latex-extra texlive-lang-spanish \
            texlive-bibtex-extra texlive-fonts-recommended biber \
            fonts-dejavu-core fonts-texgyre ttf-mscorefonts-installer poppler-utils
          fc-cache -f
          test "$(fc-match --format '%{family}' 'Times New Roman')" = 'Times New Roman'
      - name: Compile from the selected revision
        run: |
          make -B -C latex
      - name: Validate and package the report
        run: |
          pdfinfo latex/main.pdf
          mkdir -p "$RUNNER_TEMP/document-assets"
          cp latex/main.pdf "$RUNNER_TEMP/document-assets/TT2026-B136-reporte.pdf"
          cd "$RUNNER_TEMP/document-assets"
          sha256sum ./*.pdf > SHA256SUMS
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > SOURCE_COMMIT
      - name: Preserve build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: document-build-logs
          path: |
            latex/*.log
            latex/*.blg
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload document artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: ${{ runner.temp }}/document-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach report to release
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report-pdf
          path: document-assets
      - name: Verify and upload release assets
        working-directory: document-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          sha256sum --check SHA256SUMS
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" \
            TT2026-B136-reporte.pdf SHA256SUMS SOURCE_COMMIT --clobber
