name: Documents

on:
  pull_request:
    paths:
      - '.github/workflows/documents.yml'
      - '.gitignore'
      - 'latex/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/documents.yml'
      - '.gitignore'
      - 'latex/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach the report to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: documents-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build report PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Install LaTeX and document fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo --preserve-env=DEBIAN_FRONTEND apt-get install -y --no-install-recommends \
            latexmk texlive-luatex texlive-latex-extra texlive-lang-spanish \
            texlive-bibtex-extra texlive-fonts-recommended texlive-plain-generic biber \
            fonts-dejavu-core fonts-texgyre fontconfig poppler-utils curl cabextract
      - name: Install verified Times New Roman fonts
        env:
          TIMES_ARCHIVE_SHA256: db56595ec6ef5d3de5c24994f001f03b2a13e37cee27bc25c58f6f43e8f807ab
        run: |
          # Archive provenance and installation policy: docs/adr/0017-report-font-installation.md.
          font_archive="$RUNNER_TEMP/times32.exe"
          font_directory="$HOME/.local/share/fonts/report-times"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --retry 3 --retry-max-time 240 \
            --output "$font_archive" \
            'https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/times32.exe'
          printf '%s  %s\n' "$TIMES_ARCHIVE_SHA256" "$font_archive" | sha256sum --check --strict
          mkdir -p "$font_directory"
          cabextract --quiet --directory "$font_directory" --filter '*.TTF' "$font_archive"
          test "$(find "$font_directory" -maxdepth 1 -name '*.TTF' | wc -l)" -eq 4
          fc-cache -f
          test "$(fc-match --format '%{family}' 'Times New Roman')" = 'Times New Roman'
      - name: Compile from the selected revision
        run: |
          make -B -C latex
      - name: Validate and package the report
        run: |
          pdfinfo latex/main.pdf
          mkdir -p "$RUNNER_TEMP/document-assets"
          cp latex/main.pdf "$RUNNER_TEMP/document-assets/TT2026-B136-reporte.pdf"
          cd "$RUNNER_TEMP/document-assets"
          sha256sum ./*.pdf > SHA256SUMS
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > SOURCE_COMMIT
      - name: Preserve build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: document-build-logs
          path: |
            latex/*.log
            latex/*.blg
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload document artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: ${{ runner.temp }}/document-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach report to release
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: report-pdf
          path: document-assets
      - name: Verify and upload release assets
        working-directory: document-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          sha256sum --check SHA256SUMS
          gh release view "$RELEASE_TAG" --json tagName
          gh release upload "$RELEASE_TAG" \
            TT2026-B136-reporte.pdf SHA256SUMS SOURCE_COMMIT --clobber
