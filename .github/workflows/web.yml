name: Web

on:
  push:
    paths:
      - 'web/**'
      - 'crates/**'
      - 'migrations/**'
      - 'pki/**'
      - 'scripts/web-demo.sh'
      - 'scripts/web-participant-fixtures.mjs'
      - 'scripts/web-case-administration-fixtures.mjs'
      - 'scripts/test-backends.sh'
      - 'scripts/setup-document-formats.sh'
      - 'scripts/setup-document-formats.py'
      - 'scripts/document_format_archive.py'
      - 'scripts/tests/test_setup_document_formats.py'
      - 'Cargo.*'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'crates/**'
      - 'migrations/**'
      - 'pki/**'
      - 'scripts/web-demo.sh'
      - 'scripts/web-participant-fixtures.mjs'
      - 'scripts/web-case-administration-fixtures.mjs'
      - 'scripts/test-backends.sh'
      - 'scripts/setup-document-formats.sh'
      - 'scripts/setup-document-formats.py'
      - 'scripts/document_format_archive.py'
      - 'scripts/tests/test_setup_document_formats.py'
      - 'Cargo.*'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  integration:
    name: Browser with real services
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install isolated backend tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server jq unzip
          pg_config --bindir >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare verified document format library
        run: |
          library=$(bash scripts/setup-document-formats.sh)
          printf 'TT_TEST_QPDF_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
      - name: Run browser against Rust and disposable services
        run: bash scripts/web-demo.sh
      - name: Preserve failed browser screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-failure
          path: |
            web/test-results-live/**/*.png
            web/test-results-live/**/error-context.md
            web/test-results-live/**/api-failures.json
          if-no-files-found: ignore
          retention-days: 7
