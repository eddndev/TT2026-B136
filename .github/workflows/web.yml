name: Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crates/**'
      - 'migrations/**'
      - 'pki/**'
      - 'scripts/web-demo.sh'
      - 'scripts/web-alert-fixtures.mjs'
      - 'scripts/web-participant-fixtures.mjs'
      - 'scripts/web-typed-participant-fixtures.mjs'
      - 'scripts/web-case-administration-fixtures.mjs'
      - 'scripts/web-case-stage-fixtures.mjs'
      - 'scripts/web-hearing-fixtures.mjs'
      - 'scripts/web-fixture-provisioning.mjs'
      - 'scripts/web-document-content-fixtures.mjs'
      - 'scripts/web-member-fixtures.mjs'
      - 'scripts/web-document-content-corruption.mjs'
      - 'scripts/web-resource-fixtures.mjs'
      - 'scripts/web-deadline-fixtures.mjs'
      - 'scripts/web-deadline-reevaluation.mjs'
      - 'scripts/web-combined-agenda-fixtures.mjs'
      - 'scripts/web-agenda-five-case-fixtures.mjs'
      - 'scripts/web-deadline-definitions.mjs'
      - 'scripts/web-hearing-result-fixtures.mjs'
      - 'scripts/web-calendar-fixtures.mjs'
      - 'scripts/test-backends.sh'
      - 'scripts/setup-document-formats.sh'
      - 'scripts/setup-document-formats.py'
      - 'scripts/document_format_archive.py'
      - 'scripts/tests/test_setup_document_formats.py'
      - 'Cargo.*'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'crates/**'
      - 'migrations/**'
      - 'pki/**'
      - 'scripts/web-demo.sh'
      - 'scripts/web-alert-fixtures.mjs'
      - 'scripts/web-participant-fixtures.mjs'
      - 'scripts/web-typed-participant-fixtures.mjs'
      - 'scripts/web-case-administration-fixtures.mjs'
      - 'scripts/web-case-stage-fixtures.mjs'
      - 'scripts/web-hearing-fixtures.mjs'
      - 'scripts/web-fixture-provisioning.mjs'
      - 'scripts/web-document-content-fixtures.mjs'
      - 'scripts/web-member-fixtures.mjs'
      - 'scripts/web-document-content-corruption.mjs'
      - 'scripts/web-resource-fixtures.mjs'
      - 'scripts/web-deadline-fixtures.mjs'
      - 'scripts/web-deadline-reevaluation.mjs'
      - 'scripts/web-combined-agenda-fixtures.mjs'
      - 'scripts/web-agenda-five-case-fixtures.mjs'
      - 'scripts/web-deadline-definitions.mjs'
      - 'scripts/web-hearing-result-fixtures.mjs'
      - 'scripts/web-calendar-fixtures.mjs'
      - 'scripts/test-backends.sh'
      - 'scripts/setup-document-formats.sh'
      - 'scripts/setup-document-formats.py'
      - 'scripts/document_format_archive.py'
      - 'scripts/tests/test_setup_document_formats.py'
      - 'Cargo.*'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-shards:
    name: Web checks (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1 --shard=${{ matrix.shard }}/2 --reporter=line,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/browser-junit.xml
      - name: Publish browser durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-durations-${{ matrix.shard }}
          path: web/test-results/browser-junit.xml
          if-no-files-found: error
          retention-days: 7

  verify:
    if: always()
    needs: verify-shards
    runs-on: ubuntu-24.04
    steps:
      - name: Require every web shard
        env:
          SHARD_RESULT: ${{ needs.verify-shards.result }}
        run: test "$SHARD_RESULT" = success

  integration-shards:
    name: Browser with real services (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: live-workspace
          cache-workspace-crates: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install isolated backend tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server jq unzip
          pg_config --bindir >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare verified document format library
        run: |
          library=$(bash scripts/setup-document-formats.sh)
          printf 'TT_TEST_QPDF_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
      - name: Run browser against Rust and disposable services
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results-live/browser-junit.xml
          TT_WEB_FIXTURE_WORKERS: '2'
        run: bash scripts/web-demo.sh --shard=${{ matrix.shard }}/3 --reporter=line,junit
      - name: Publish real browser durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-durations-${{ matrix.shard }}
          path: web/test-results-live/browser-junit.xml
          if-no-files-found: error
          retention-days: 7
      - name: Preserve failed browser screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-failure-${{ matrix.shard }}
          path: |
            web/test-results-live/**/*.png
            web/test-results-live/**/error-context.md
            web/test-results-live/**/api-failures.json
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Browser with real services
    if: always()
    needs: integration-shards
    runs-on: ubuntu-24.04
    steps:
      - name: Require every real browser shard
        env:
          SHARD_RESULT: ${{ needs.integration-shards.result }}
        run: test "$SHARD_RESULT" = success
