# Runner isolation: docs/adr/0052-owned-ci-runners.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      dispatch_measurement:
        description: Run only the extended dispatch measurement
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '1'
  # Bound test artifacts while retaining source locations; see docs/adr/0027-ci-debug-information.md.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  format:
    if: ${{ !inputs.dispatch_measurement }}
    name: Format
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment helpers
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_deploy_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify cancellation scope
        run: node --test scripts/tests/test_cancel_ci_campaign.cjs
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  deployment-backup:
    if: ${{ !inputs.dispatch_measurement }}
    name: Deployment backup
    runs-on: [self-hosted, Linux, X64, tt-ci-live-primary]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Redis snapshot and restart
        run: python3 -B scripts/tests/test_deployment_redis_snapshot.py
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  lint:
    if: ${{ !inputs.dispatch_measurement }}
    name: Lint
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Prepare persistent compiler cache
        run: bash scripts/prepare-ci-workspace.sh checks
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  test:
    if: ${{ !inputs.dispatch_measurement }}
    name: Test (${{ matrix.shard }}/${{ matrix.total }})
    strategy:
      fail-fast: true
      # Activate only after provisioning; see docs/adr/0050-isolated-test-slots.md.
      matrix:
        include: ${{ fromJSON(vars.TT_CI_DEDICATED == 'true' && '[{"shard":1,"total":1,"runner":"tt-ci-dedicated","slots":16}]' || '[{"shard":1,"total":2,"runner":"tt-ci-vps1","slots":0},{"shard":2,"total":2,"runner":"tt-ci-vps2","slots":0}]') }}
    runs-on: [self-hosted, Linux, X64, '${{ matrix.runner }}']
    timeout-minutes: 210
    services:
      postgres:
        image: ${{ matrix.slots == 0 && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - '127.0.0.1::5432'
        options: >-
          --memory 768m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1::6379'
        options: >-
          --memory 128m
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Python 3.12 for isolated workers
        run: |
          env -i /bin/sh -c 'python3 -' <<'PY'
          import fcntl
          import sys
          assert sys.version_info >= (3, 12), "Python 3.12+ is required with an empty environment"
          assert hasattr(fcntl, "F_SETPIPE_SZ"), "Python must expose Linux pipe sizing"
          print(sys.executable, sys.version.split()[0])
          PY
      - name: Select PostgreSQL 16 client tools
        run: |
          if [ -x /usr/pgsql-16/bin/pg_dump ]; then
            printf '/usr/pgsql-16/bin\n' >> "$GITHUB_PATH"
          elif command -v pg_config >/dev/null; then
            pg_config --bindir >> "$GITHUB_PATH"
          fi
      - name: Require PostgreSQL 16 client tools
        run: |
          pg_dump --version | grep -qE 'PostgreSQL\) 16\.'
          pg_restore --version | grep -qE 'PostgreSQL\) 16\.'
          psql --version | grep -qE 'PostgreSQL\) 16\.'
      - name: Configure isolated backend addresses
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_TEST_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          if [ -n "$POSTGRES_TEST_PORT" ]; then
            printf 'IDENTITY_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:%s/postgres\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
            printf 'CASE_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:%s/case_tests\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
            printf 'DOCUMENT_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:%s/document_tests\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
          fi
          printf 'IDENTITY_TEST_REDIS_URL=redis://127.0.0.1:%s/\n' "$REDIS_TEST_PORT" >> "$GITHUB_ENV"
      - name: Configure disposable PostgreSQL for CI
        if: ${{ matrix.slots == 0 }}
        run: bash scripts/configure-ci-postgres.sh
      - name: Prepare disk-backed temporary directory
        run: |
          mkdir -p output/tmp
          chmod 700 output/tmp
          test -x "$HOME/.cargo/bin/rustup"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          printf 'TMPDIR=%s/output/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/tt-ci/target"
          printf 'CARGO_TARGET_DIR=%s/.cache/tt-ci/target\n' "$HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: taiki-e/install-action@v2
        if: ${{ matrix.slots > 0 }}
        with:
          tool: cargo-nextest@0.9.146
      - name: Check CI helpers and native format setup
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_setup_document_formats.py
          python3 -B -m unittest discover -s scripts/tests -p test_install_media_decoder.py
          python3 -B -m unittest discover -s scripts/tests -p "test_ci_*.py"
          python3 -B scripts/check-test-layout.py
      - name: Prepare verified document format library
        run: |
          library=$(bash scripts/setup-document-formats.sh)
          printf 'TT_TEST_QPDF_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
          python3 -B scripts/install_media_decoder.py --verify --prefix /opt/tt-media
          printf 'TT_FFPROBE_PATH=/opt/tt-media/bin/ffprobe\nTT_FFMPEG_PATH=/opt/tt-media/bin/ffmpeg\n' >> "$GITHUB_ENV"
      - name: Create isolated case and document test databases
        if: ${{ matrix.slots == 0 }}
        run: psql "$IDENTITY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE case_tests' -c 'CREATE DATABASE document_tests'
      - name: Verify independent judicial calendar vectors and SQL guards
        if: ${{ matrix.shard == 1 }}
        run: |
          python3 -B crates/domain/tests/fixtures/generate_judicial_calendar_vectors.py --check
          python3 -B scripts/tests/test_judicial_calendar_generator.py
          if [ '${{ matrix.slots }}' -gt 0 ]; then
            python3 -B scripts/ci_native_postgres.py -- python3 -B scripts/tests/test_judicial_calendar_sql.py
          else
            python3 -B scripts/tests/test_judicial_calendar_sql.py
          fi
      - name: Select bounded compiler count
        env:
          MAX_COMPILERS: ${{ matrix.slots > 0 && '4' || '2' }}
          MEMORY_CEILING_GIB: ${{ matrix.slots > 0 && '24' || '6' }}
        run: python3 -B scripts/ci-resources.py --max-jobs "$MAX_COMPILERS" --memory-ceiling-gib "$MEMORY_CEILING_GIB"
      - name: Check documentation examples
        if: ${{ matrix.shard == 1 }}
        run: cargo test --workspace --doc --locked
      - name: Run this shard with coverage
        if: ${{ matrix.slots == 0 }}
        run: python3 -B scripts/ci_test_shard.py "${{ matrix.shard }}"
      - name: Run individually scheduled tests with isolated backends
        if: ${{ matrix.slots > 0 }}
        run: python3 -B scripts/ci_native_postgres.py -- python3 -B scripts/ci_nextest.py --slots "${{ matrix.slots }}"
      - name: Ensure native PostgreSQL cleanup
        if: ${{ always() && matrix.slots > 0 }}
        run: python3 -B scripts/ci_native_postgres.py --cleanup
      - name: Publish individual test durations
        if: ${{ always() && matrix.slots > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: output/ci-nextest-junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Publish coverage from this execution
        uses: actions/upload-artifact@v4
        with:
          name: workspace-coverage-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 7
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  dispatch-measurement:
    if: ${{ inputs.dispatch_measurement }}
    name: Extended dispatch measurement
    runs-on: [self-hosted, Linux, X64, tt-ci-vps2]
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - '127.0.0.1::5432'
        options: >-
          --memory 768m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '127.0.0.1::6379'
        options: >-
          --memory 128m
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure isolated backend addresses
        env:
          POSTGRES_TEST_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_TEST_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          printf 'IDENTITY_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:%s/postgres\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
          printf 'CASE_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:%s/case_tests\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
          printf 'DOCUMENT_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:%s/document_tests\n' "$POSTGRES_TEST_PORT" >> "$GITHUB_ENV"
          printf 'IDENTITY_TEST_REDIS_URL=redis://127.0.0.1:%s/\n' "$REDIS_TEST_PORT" >> "$GITHUB_ENV"
      - name: Configure disposable PostgreSQL for CI
        run: bash scripts/configure-ci-postgres.sh
      - name: Prepare disk-backed temporary directory
        run: |
          mkdir -p output/tmp
          chmod 700 output/tmp
          test -x "$HOME/.cargo/bin/rustup"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
          printf 'TMPDIR=%s/output/tmp\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/tt-ci/target"
          printf 'CARGO_TARGET_DIR=%s/.cache/tt-ci/target\n' "$HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare verified document format library
        run: |
          library=$(bash scripts/setup-document-formats.sh)
          printf 'TT_TEST_QPDF_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
          python3 -B scripts/install_media_decoder.py --verify --prefix /opt/tt-media
          printf 'TT_FFPROBE_PATH=/opt/tt-media/bin/ffprobe\nTT_FFMPEG_PATH=/opt/tt-media/bin/ffmpeg\n' >> "$GITHUB_ENV"
      - name: Create isolated case and document test databases
        run: psql "$IDENTITY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE case_tests' -c 'CREATE DATABASE document_tests'
      - name: Measure extended dispatch campaign
        run: |
          set -o pipefail
          cargo test -p infrastructure --test deadline_dispatch_measurement --locked \
            -- --ignored --nocapture 2>&1 | tee output/dispatch-measurement.log
      - name: Publish extended measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-measurement
          path: output/dispatch-measurement.log
          if-no-files-found: error
          retention-days: 30
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  msrv:
    if: ${{ !inputs.dispatch_measurement }}
    name: MSRV check (Rust 1.88)
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'
      - name: Prepare persistent compiler cache
        run: bash scripts/prepare-ci-workspace.sh checks
      - name: Build check on the minimum supported Rust version
        run: cargo check --workspace
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  coverage:
    name: Coverage
    needs: [test, deployment-backup]
    if: ${{ !inputs.dispatch_measurement }}
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: workspace-coverage-*
          path: coverage-shards
      - name: Enforce the per-crate gate on the cryptographic crates
        env:
          EXPECTED_SHARDS: ${{ vars.TT_CI_DEDICATED == 'true' && '1' || '2' }}
        run: |
          python3 -B scripts/merge_coverage_shards.py \
            --expected-shards "$EXPECTED_SHARDS" \
            coverage-shards/workspace-coverage-*/coverage-shard-*.info coverage.json
          scripts/coverage-gate.sh coverage.json
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  deny:
    if: ${{ !inputs.dispatch_measurement }}
    name: Dependency policy
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign

  binary-size:
    if: ${{ !inputs.dispatch_measurement }}
    name: Release binary size
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare persistent compiler cache
        run: bash scripts/prepare-ci-workspace.sh checks
      - name: Build release binary
        run: cargo build --release --bin despacho-cli
      - name: Fail if despacho-cli exceeds 25 MB
        run: |
          bin="$CARGO_TARGET_DIR/release/despacho-cli"
          size=$(stat -c %s "$bin")
          limit=$((25 * 1024 * 1024))
          echo "despacho-cli release size: $size bytes (limit: $limit bytes)"
          if [ "$size" -gt "$limit" ]; then
            echo "error: release binary exceeds the 25 MB limit"
            exit 1
          fi
      - name: Cancel the failed campaign
        if: ${{ failure() && !cancelled() }}
        uses: ./.github/actions/cancel-ci-campaign
