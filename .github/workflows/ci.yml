# Continuous integration for the Rust workspace.
#
# Jobs:
#   format       - rustfmt check
#   lint         - clippy with warnings denied
#   test         - full workspace test suite
#   msrv         - build check on the minimum supported Rust version (1.78)
#   coverage     - line coverage via cargo-llvm-cov, gated at 90 percent
#                  per cryptographic crate by scripts/coverage-gate.sh
#   deny         - dependency policy (advisories, licenses, bans, sources)
#   binary-size  - release binary of despacho-cli must stay under 25 MB

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  msrv:
    name: MSRV check (Rust 1.78)
    runs-on: ubuntu-24.04
    # Informational until the dependency set is frozen: if a transitive
    # dependency raises its minimum supported Rust version, this job surfaces
    # the breakage without blocking the pipeline. Remove continue-on-error
    # once the dependency set is stable, to make the MSRV guarantee binding.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78"
      - uses: Swatinem/rust-cache@v2
      - name: Build check on the minimum supported Rust version
        run: cargo check --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure line coverage
        run: |
          cargo llvm-cov --workspace --json --summary-only \
            --output-path coverage.json
      - name: Enforce the per-crate gate on the cryptographic crates
        run: scripts/coverage-gate.sh coverage.json

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  binary-size:
    name: Release binary size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin despacho-cli
      - name: Fail if despacho-cli exceeds 25 MB
        run: |
          bin=target/release/despacho-cli
          size=$(stat -c %s "$bin")
          limit=$((25 * 1024 * 1024))
          echo "despacho-cli release size: $size bytes (limit: $limit bytes)"
          if [ "$size" -gt "$limit" ]; then
            echo "error: release binary exceeds the 25 MB limit"
            exit 1
          fi
