name: Deploy version

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prepare_version:
        description: Build a candidate for migration rehearsal without deployment
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: qadra-version-deployment
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !github.event.deleted }}
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and exact source commit
        id: identity
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_version || github.ref_name }}
        run: |
          python3 -c 'import sys; sys.path.insert(0, "ops/deploy"); from bundle import validate_version; import os; validate_version(os.environ["TAG"])'
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$commit" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo 'Candidate version already has a tag; select an unused version' >&2
              exit 1
            fi
          fi
          printf 'tag=%s\ncommit=%s\n' "$TAG" "$commit" >> "$GITHUB_OUTPUT"
      - name: Verify deployment state transitions and archive admission
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_deploy_*.py'

  # Gate reuse policy: docs/adr/0081-deploy-gate-reuse.md.
  gates:
    needs: version
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    outputs:
      reuse_rust: ${{ steps.reuse.outputs.reuse_rust }}
      rust_run_id: ${{ steps.reuse.outputs.rust_run_id }}
      reuse_web: ${{ steps.reuse.outputs.reuse_web }}
      web_run_id: ${{ steps.reuse.outputs.web_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find gate runs that already verified the exact inputs
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: python3 -B scripts/deploy_gate_reuse.py --commit "$COMMIT" --repository "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

  rust:
    needs: [version, gates]
    if: ${{ needs.gates.outputs.reuse_rust != 'true' }}
    uses: ./.github/workflows/ci.yml

  web:
    needs: [version, gates]
    if: ${{ needs.gates.outputs.reuse_web != 'true' }}
    uses: ./.github/workflows/web.yml

  package:
    needs: [version, gates, rust, web]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' && needs.gates.result == 'success'
      && (needs.rust.result == 'success' || (needs.rust.result == 'skipped' && needs.gates.outputs.reuse_rust == 'true'))
      && (needs.web.result == 'success' || (needs.web.result == 'skipped' && needs.gates.outputs.reuse_web == 'true')) }}
    runs-on: [self-hosted, Linux, X64, tt-ci-dedicated]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      VERSION: ${{ needs.version.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        if: ${{ needs.gates.outputs.reuse_web != 'true' }}
        with:
          name: browser-crypto-module
          path: web/apps/qadra/src/generated/browser-crypto/
      - uses: actions/download-artifact@v4
        if: ${{ needs.gates.outputs.reuse_web == 'true' }}
        with:
          name: browser-crypto-module
          path: web/apps/qadra/src/generated/browser-crypto/
          run-id: ${{ needs.gates.outputs.web_run_id }}
          github-token: ${{ github.token }}
      - name: Build the verified version and package native dependencies
        run: bash scripts/build-release.sh "$VERSION" "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: qadra-${{ needs.version.outputs.tag }}-${{ needs.version.outputs.commit }}
          path: output/releases/qadra-*
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [version, package]
    runs-on: [self-hosted, Linux, X64, tt-ci-vps1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: qadra-${{ needs.version.outputs.tag }}-${{ needs.version.outputs.commit }}
          path: output/releases
      - name: Refuse deleted or moved tags
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_COMMIT"
      - name: Transfer, activate and verify the exact release over pinned SSH
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
          DEPLOY_HOST: ${{ vars.QADRA_HOST }}
          DEPLOY_PORT: ${{ vars.QADRA_PORT }}
          DEPLOY_USER: ${{ vars.QADRA_USER }}
          DEPLOY_ROOT: ${{ vars.QADRA_ROOT }}
          DEPLOY_CONTROLLER_SHA256: ${{ vars.QADRA_CONTROLLER_SHA256 }}
          DEPLOY_PYTHON: ${{ vars.QADRA_PYTHON }}
          DEPLOY_SSH_KEY: ${{ secrets.QADRA_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.QADRA_KNOWN_HOSTS }}
        run: bash scripts/deploy-via-ssh.sh
