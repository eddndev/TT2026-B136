[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/web",
    "crates/bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/eddndev/TT2026-B136"

[workspace.dependencies]
# Cross-cutting crates shared by workspace members. Members opt in with
# `dep.workspace = true`. Versions are declared here so the whole workspace
# stays on one compatible set.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3.47", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = { version = "0.14", default-features = false, features = ["toml"] }
dotenvy = "0.15"
anyhow = "1"
mockall = "0.13"
# Cross-process advisory file locking for append-only logs and the local
# timestamp authority's serial file. The adapter keeps one portable locking
# API across every supported platform.
fs2 = "0.4"

# Temporary files and directories, used by adapters that stage inputs for
# openssl subprocesses and by tests. proptest stays on the reviewed 1.8 line
# so this dependency security update does not also change generated inputs.
proptest = "~1.8"
tempfile = "3"

# Cryptographic crates. The der 0.7 family remains pinned because moving to
# x509-cert 0.3 and rsa 0.10 requires a coordinated API migration. Rationale:
# docs/adr/0001-msrv-and-dependency-pinning.md.
# These are declared for the workspace but not yet consumed by any member.
ring = "0.17.12"
rsa = "0.9"
sha2 = "0.10"
der = "0.7"
x509-cert = "0.2"
cms = "0.2"
x509-tsp = "0.1"
argon2 = "0.5"
# otpauth adds provisioning-URI generation; zeroize wipes the secret held
# inside the library's TOTP value when it drops.
totp-rs = { version = "5", features = ["otpauth", "zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
getrandom = "0.2"
# Synchronous database clients are pinned to security-fixed releases. See
# docs/adr/0012-revocable-sessions-and-rbac.md for the blocking-I/O tradeoff
# and docs/adr/0013-raise-msrv-for-security-fixes.md for the version floor.
postgres = { version = "=0.19.14", features = ["with-serde_json-1", "with-uuid-1"] }
tokio-postgres = "=0.7.18"
redis = "=0.25.4"

[profile.release]
strip = true
lto = true

# Argon2id is memory-hard by design, so an unoptimized build of its kernel
# makes every hash take seconds and the test suite take minutes. Optimize
# only the hashing kernels; the workspace itself keeps full debug info.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# RSA-3072 private-key operations run big-integer modular exponentiation;
# unoptimized builds make every signature take seconds and the test suite
# crawl. Optimize only the big-integer kernel the rsa crate relies on.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
