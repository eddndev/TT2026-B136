[package]
autotests = false
name = "infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
rsa.workspace = true
# The oid feature ties the SHA-256 digest to its DigestInfo object
# identifier, which PKCS#1 v1.5 signing and verification embed in the
# padded message.
sha2 = { workspace = true, features = ["oid"] }
thiserror.workspace = true
argon2.workspace = true
getrandom.workspace = true
# The audit log file adapter parses stored RFC 3339 timestamps back into
# datetime values, which needs the parsing feature on top of the
# workspace-wide selection.
time = { workspace = true, features = ["parsing"] }
totp-rs.workspace = true
# Cross-process advisory file locking that serializes concurrent appends
# to the file audit log so the hash chain cannot fork, and the local
# timestamp authority's reply step, whose serial file openssl updates
# with a non-atomic read-increment-write.
fs2.workspace = true
# X.509 parsing for certificate chain validation and signer certificates;
# see docs/adr/0004-certificate-validation-implementation.md.
der = { workspace = true, features = ["pem"] }
x509-cert.workspace = true
# RFC 3161 timestamp token parsing (imprint and generation time); the
# cryptographic check is delegated to an openssl subprocess, see
# docs/adr/0005-rfc3161-verification-strategy.md.
cms.workspace = true
x509-tsp.workspace = true
# Blocking http client and token transport encoding for the remote
# timestamping provider adapter.
reqwest.workspace = true
base64.workspace = true
zeroize.workspace = true
# Private scratch directories for staging openssl subprocess inputs, so
# the staging paths are unpredictable and unreadable by other local
# users and are removed even when a check aborts early.
tempfile.workspace = true
postgres.workspace = true
tokio-postgres.workspace = true
redis.workspace = true
uuid.workspace = true
libloading.workspace = true
zip.workspace = true
quick-xml.workspace = true
rustix.workspace = true
flate2.workspace = true
crc32fast.workspace = true

[dev-dependencies]
proptest.workspace = true

