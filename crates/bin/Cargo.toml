[package]
name = "despacho-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "despacho-cli"
path = "src/main.rs"

[[bin]]
name = "qadra-ca"
path = "src/ca/main.rs"

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
infrastructure = { path = "../infrastructure" }
web = { path = "../web" }
# Strict PEM decoding and SHA-256 of the evidence material served to the
# in-browser validator. See docs/adr/0085-in-browser-evidence-validation.md.
evidence-verify = { path = "../evidence-verify" }
axum.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
serde.workspace = true
anyhow.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
uuid.workspace = true
zeroize.workspace = true
rustix = { workspace = true, features = ["termios"] }
# The verify command accepts an explicit evaluation instant in RFC 3339
# form, which needs the parsing feature on top of the workspace-wide
# formatting selection.
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }

[dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios"] }
mockall.workspace = true
redis.workspace = true
tower = { version = "0.5", features = ["util"] }
postgres.workspace = true
reqwest.workspace = true
tempfile.workspace = true
